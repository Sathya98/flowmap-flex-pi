# RoboTwin LSD, curriculum time sampling (see flowmap_robotwin_study.yaml).
# Curriculum: max jump grows 0.25 -> 1.0 over updates 0-1000 (uniform area), then all
# jumps with the jump size uniform (tilts toward large, one-step-sized jumps).
# Init: released RoboTwin FM checkpoint (the study's AGIBOT init is unavailable:
# a labelled deviation). 75% diagonal FM / 25% off-diagonal, learned time weight.
defaults:
  - flowmap_robotwin_study
  - _self_
wandb:
  name: robotwin-lsd-curriculum-s42
  group: robotwin-lsd
model:
  flow_map:
    objective: lsd
    lmd_teacher_gradient: detached
    teacher_checkpoint: null
    learned_time_weighting: true
    self_diagonal_fraction: 0.75
    time_sampling: uniform_triangle
    strip_width_start: 0.25
    strip_anneal_updates: 1000
    uniform_jump_from_update: 1000
