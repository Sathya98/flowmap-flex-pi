# Controlled 50-update implementation pilot; not a convergence budget.
defaults:
  - flowmap_libero_lmd_pilot
  - _self_
output_dir: ./runs/flowmap_pilots/libero_lmd_fullgrad_tw${model.flow_map.distill_learned_time_weighting}_${oc.env:SLURM_JOB_ID,manual}
max_steps: 50
save_every: 10
keep_last_n_weights: 5
keep_last_n_states: 2
model:
  flow_map:
    lmd_teacher_gradient: full
    distill_ema: true
